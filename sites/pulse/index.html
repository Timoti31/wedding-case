<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#fafafa;color:#111}
  .top{position:sticky;top:0;background:#fff;border-bottom:1px solid #e6e6e6;padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:5}
  .top b{font-size:24px;background:linear-gradient(90deg,#ff3d6e,#7b4dff);-webkit-background-clip:text;color:transparent;cursor:pointer}
  .top input{margin-left:auto;padding:8px 12px;border-radius:10px;border:0;background:#efefef;width:200px}
  .wrap{max-width:620px;margin:0 auto;padding:16px}
  .res{background:#fff;border:1px solid #eee;border-radius:12px}
  .res a{display:flex;align-items:center;gap:12px;padding:10px 14px;color:#111;text-decoration:none;border-bottom:1px solid #f2f2f2}
  .res img{width:44px;height:44px;border-radius:50%;object-fit:cover}
  .head{display:flex;gap:22px;align-items:center;margin:8px 0 18px}
  .ava{width:96px;height:96px;border-radius:50%;object-fit:cover;padding:3px;background:linear-gradient(45deg,#ff3d6e,#ffb347,#7b4dff)}
  .ava.nost{background:#ddd}
  .head h1{font-size:20px}
  .head .bio{font-size:14px;color:#444;margin-top:6px;white-space:pre-line}
  .stats{display:flex;gap:16px;font-size:14px;margin-top:8px}
  .stories{display:flex;gap:12px;margin-bottom:18px;overflow-x:auto}
  .st{text-align:center;font-size:12px;cursor:pointer}
  .st img{width:64px;height:64px;border-radius:50%;object-fit:cover;padding:2px;background:linear-gradient(45deg,#ff3d6e,#7b4dff)}
  .post{background:#fff;border:1px solid #eee;border-radius:12px;margin-bottom:18px;overflow:hidden}
  .post img{width:100%;display:block}
  .post .t{padding:12px 14px;font-size:15px;line-height:1.45}
  .post .d{padding:4px 14px 12px;font-size:12px;color:#888}
  .lk{padding:10px 14px 0;font-size:14px;font-weight:600}
  .cm{padding:2px 14px;font-size:14px}
  .cm a{color:#111;text-decoration:none}
  .post .t{padding:6px 14px 4px}
  .post .txt{padding:18px 16px;font-size:17px;line-height:1.45;background:linear-gradient(135deg,#fff1f4,#f1eeff)}
  .sv{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:20}
  .sv img{max-height:92vh;max-width:100%}
  .sv .cap{position:absolute;top:18px;left:18px;color:#fff;font-size:14px;text-shadow:0 1px 4px #000}
  .sv .txt{position:absolute;bottom:12%;left:0;right:0;text-align:center;color:#fff;font-size:22px;text-shadow:0 2px 6px #000}
  .sv .black{width:360px;height:640px;max-width:92vw;max-height:88vh;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px;font-size:20px}
  .back{font-size:14px;color:#7b4dff;cursor:pointer;margin-bottom:10px;display:inline-block}
</style>
</head>
<body>
<div class="top"><b onclick="location.hash=''">Pulse</b><input id="q" placeholder="Поиск людей"></div>
<div class="wrap" id="main"></div>
<div class="sv" id="sv" onclick="this.style.display='none'"><div id="svb"></div></div>
<script src="data.js"></script>
<script>
const P=window.P;
const main=document.getElementById("main");
function list(q){
  const items=Object.entries(P).filter(([k,p])=>!q||p.name.toLowerCase().includes(q)||k.includes(q));
  main.innerHTML=`<div class="res">${items.map(([k,p])=>`<a href="#${k}"><img src="${p.ava}"><div><b>${p.name}</b><br><small style="color:#888">${p.bio.split("\n")[0]}</small></div></a>`).join("")}</div>`;
}
function profile(k){
  const p=P[k];if(!p)return list("");
  main.innerHTML=`<span class="back" onclick="location.hash=''">← Поиск</span>
  <div class="head"><img class="ava ${p.stories?"":"nost"}" src="${p.ava}" ${p.stories?`onclick="story('${k}',0)" style="cursor:pointer"`:""}><div><h1>${p.name}</h1><div class="stats"><span><b class="pc">${p.posts.length}</b> публ.</span><span><b>${p.f}</b> подписчиков</span><span><b>${p.fl||0}</b> подписок</span></div><div class="bio">${p.bio}</div></div></div>
  ${p.stories?`<div class="stories">${p.stories.map((s,i)=>`<div class="st" onclick="story('${k}',${i})"><img src="${s.img||p.ava}"><div>${s.cap?s.cap.split(" ·")[0]:s.d}</div></div>`).join("")}</div>`:""}
  ${p.posts.map(x=>`<div class="post">${x.img?`<img src="${x.img}" onerror="this.closest('.post').remove();upd()">`:`<div class="txt">${x.txt}</div>`}<div class="lk">♡ ${x.l||0} отметок «нравится»</div>${x.t?`<div class="t"><b>${p.name}</b> ${x.t}</div>`:""}${(x.c||[]).map(([u,t])=>`<div class="cm"><a ${P[u]?`href="#${u}"`:""}><b>${NAMES[u]||u}</b></a> ${t}</div>`).join("")}<div class="d">${x.d}</div></div>`).join("")}`;
  upd();
}
function upd(){const c=document.querySelector(".pc");if(c)c.textContent=document.querySelectorAll(".post").length}
function story(k,i){
  const s=P[k].stories[i];const b=document.getElementById("svb");
  b.innerHTML=s.black?`<div class="black">${s.black}</div><div class="cap">${P[k].name} · ${s.d}</div>`:`<img src="${s.img}"><div class="cap">${P[k].name} · ${s.cap}</div>${s.txt?`<div class="txt">${s.txt}</div>`:""}`;
  document.getElementById("sv").style.display="flex";
}
function route(){const k=location.hash.slice(1);k?profile(k):list(document.getElementById("q").value.toLowerCase())}
window.addEventListener("hashchange",route);
document.getElementById("q").oninput=e=>{location.hash="";list(e.target.value.toLowerCase())};
route();
</script>
</body>
</html>
