function home(){w.innerHTML=`<div class="crumbs">Главная · <span style="color:#888">Сейчас на форуме: 37 (гостей 29)</span></div>`+SECT.map(s=>`<div class="box"><h3>${s.name}</h3>${s.threads.map(t=>`<div class="t" onclick="location.hash='${s.id}/${t.id}'"><a>${t.title}</a><small>${t.posts.length} сообщ. · ${t.posts[t.posts.length-1].d.split(",")[0]}</small></div>`).join("")}</div>`).join("")}
function thread(sid,tid){const s=SECT.find(x=>x.id===sid);const t=s&&s.threads.find(x=>x.id===tid);if(!t)return home();
 w.innerHTML=`<div class="crumbs"><a onclick="location.hash=''">Главная</a> › ${s.name}</div><div class="box"><h3>${t.title}</h3>${t.posts.map(p=>`<div class="post"><div class="u"><b>${p.u}</b>${p.info}</div><div class="c"><div class="d">${p.d}</div>${p.t}</div></div>`).join("")}</div>`}
